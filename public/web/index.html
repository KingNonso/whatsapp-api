<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peddlebot Landing Page</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #25d366, #128c7e);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        text-align: center;
        background: rgba(0, 0, 0, 0.5);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 3em;
        margin-bottom: 10px;
      }

      p {
        font-size: 1.2em;
        margin-bottom: 30px;
      }

      .links a {
        display: block;
        margin: 10px 0;
        padding: 15px 25px;
        font-size: 1.2em;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        transition:
          background 0.3s,
          transform 0.3s;
      }

      .links a:nth-child(1) {
        background: #4caf50;
      }

      .links a:nth-child(2) {
        background: #ff6f61;
      }

      .links a:nth-child(3) {
        background: #ffcc00;
      }

      .links a:hover {
        opacity: 0.8;
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>WhatsApp Peddlebot</h1>
      <p>Your ultimate WhatsApp bot for seamless communication and automation.</p>
      <div class="links">
        <a href="qr-codes/latest.png">Latest QR Code</a>
        <a href="logs/errors.log">Error Logs</a>
        <a href="logs/info.log">Info Logs</a>
      </div>
    </div>
  </body>
</html>
